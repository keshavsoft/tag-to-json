<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Items with Batches - Tally Cloud</title>

  <script>
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./index.css">
</head>

<body id="body">
  <!-- App Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-logo">
          <i class="bi bi-boxes"></i>
        </div>
        <div class="brand-info">
          <h1>
            Stock Items
            <span class="badge-tag">withBatches</span>
          </h1>
          <div class="breadcrumb-nav">
            <a href="/">Home</a> /
            <a href="/docs/">Docs</a> /
            <span>masters</span> /
            <span>StockItem</span> /
            <strong>withBatches</strong>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <div class="status-indicator" id="connectionStatus">
          <span class="status-dot"></span>
          <span id="statusText"></span>
        </div>
        <a href="/docs/" class="btn-docs-link">
          <i class="bi bi-journal-text"></i> Architecture Story Docs
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-wrapper">
    <!-- Controls Bar -->
    <section class="control-card">
      <div class="control-inputs">
        <div class="input-group-custom">
          <span class="input-label"><i class="bi bi-building me-1"></i> Company</span>
          <div id="companySelect"></div>
        </div>

        <button type="button" class="btn-fetch" id="btnFetch">
          <i class="bi bi-arrow-repeat"></i>
          <span>Fetch Batches</span>
        </button>

        <label
          style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:var(--text-muted); cursor:pointer;">
          <input type="checkbox" id="chkHasBatchesOnly">
          <span id="lblHasBatches"></span>
        </label>
      </div>

      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="Search item, batch, or godown...">
      </div>
    </section>

    <!-- KPI Metrics Strip -->
    <section class="stats-grid" id="statsGrid"></section>

    <!-- View Switcher Tabs -->
    <nav class="view-tabs">
      <button class="tab-btn active" data-tab="tableView" id="tabTable">
        <i class="bi bi-table"></i> Table & Batches View
      </button>
      <button class="tab-btn" data-tab="jsonView" id="tabJson">
        <i class="bi bi-code-slash"></i> Raw JSON Explorer
      </button>
      <button class="tab-btn" data-tab="rootItemsView" id="tabRootItems">
        <i class="bi bi-list-ul"></i> All Stock Items
      </button>
    </nav>

    <!-- Table Container -->
    <section id="tableView" class="data-card">
      <div class="table-responsive">
        <table class="custom-table" id="stockItemsTable">
          <thead>
            <tr id="tableHeaderRow">
              <th>Name</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Raw JSON Container -->
    <section id="jsonView" class="data-card" style="display: none; padding: 1rem;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
        <span id="jsonSourceLabel" style="font-size:0.85rem; color:var(--text-muted);"></span>
        <button id="btnCopyJson" class="btn-docs-link" style="cursor:pointer;">
          <i class="bi bi-clipboard"></i> Copy JSON
        </button>
      </div>
      <pre class="json-viewer-container" id="jsonViewerContent"></pre>
    </section>

    <!-- Flat root-item list without batch details -->
    <section id="rootItemsView" class="data-card" style="display: none;">
      <div class="table-responsive">
        <table class="custom-table" id="rootItemsTable">
          <thead>
            <tr id="rootItemsHeaderRow"></tr>
          </thead>
          <tbody id="rootItemsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ES Module Script -->
  <script type="module" src="./js/index.js"></script>


  <script type="module">
    import { domToSpec } from "../src/domToSpec.js";
    let lastSpec = null;

    document.getElementById("btnFetch").addEventListener("click", () => {
      const sourceEl = document.querySelector("#body");
      lastSpec = domToSpec({ inElement: sourceEl });
      document.getElementById("tableView").textContent = JSON.stringify(lastSpec, null, 2);
    });
  </script>
</body>

</html>
